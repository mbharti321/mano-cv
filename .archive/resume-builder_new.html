/* ======================== HISTORY HOOK ======================== */
function useHistory(init){
  const hist=useRef([cl(init)]);
  const idx=useRef(0);
  const[,tick]=useState(0);
  const rerender=()=>tick(n=>n+1);
  const current=hist.current[idx.current];
  const push=useCallback(s=>{
    hist.current=hist.current.slice(0,idx.current+1);
    hist.current.push(cl(s));
    if(hist.current.length>80)hist.current.shift();
    idx.current=hist.current.length-1;
    rerender();
  },[]);
  const undo=useCallback(()=>{if(idx.current>0){idx.current--;rerender();}},[]);
  const redo=useCallback(()=>{if(idx.current<hist.current.length-1){idx.current++;rerender();}},[]);
  return{current,push,undo,redo,canUndo:idx.current>0,canRedo:idx.current<hist.current.length-1};
}

    const b=new Blob([JSON.stringify({resume,customization:custom},null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(b);
    a.download=`${resume.personal.name.replace(/\s+/g,"-")}-copy-${Date.now()}.json`;a.click();
  };
  const importJSON=()=>{
    const inp=document.createElement("input");inp.type="file";inp.accept=".json";
    inp.onchange=e=>{
      const f=e.target.files[0];if(!f)return;
      const r=new FileReader();
      r.onload=ev=>{
        try{
          const d=JSON.parse(ev.target.result);
          if(d.resume)pushResume(d.resume);
          if(d.customization)setCustom(d.customization);
          alert("Resume loaded successfully!");
        }catch{alert("Invalid JSON file.");}
      };
      r.readAsText(f);
    };
    inp.click();
  };
  const applyJSON=()=>{
    try{
      const d=JSON.parse(jsonText);
      if(d.resume)update(n=>{Object.assign(n,d.resume);});
      if(d.customization)setCustom(d.customization);
      alert("Applied!");
    }catch{alert("Invalid JSON.");}
  };

  const addSection=(type,title)=>{
    const templates={
      text:{id:uid(),title,type:"text",visible:true,content:""},
      skills:{id:uid(),title,type:"skills",visible:true,items:[{id:uid(),label:"Category",value:"Skill 1, Skill 2",visible:true}]},
      experience:{id:uid(),title,type:"experience",visible:true,items:[]},
      projects:{id:uid(),title,type:"projects",visible:true,items:[]},
      education:{id:uid(),title,type:"education",visible:true,items:[]},
      publications:{id:uid(),title,type:"publications",visible:true,items:[]},
      list:{id:uid(),title,type:"list",visible:true,items:[{id:uid(),text:"Item",source:"",url:"",visible:true}]},
      custom:{id:uid(),title,type:"text",visible:true,content:""},
    };
    update(n=>{n.sections.push(templates[type]||templates.text);});
    setAddModal(false);
  };

  return(
    <div className="app">
      <div className="toolbar">
        <div className="logo">Resume<span>Forge</span></div>
        <div className="sep"/>
        <button className="tb-btn" onClick={undo} disabled={!canUndo} title="Undo (Ctrl+Z)">↩ Undo</button>
        <button className="tb-btn" onClick={redo} disabled={!canRedo} title="Redo (Ctrl+Y)">↪ Redo</button>
        <div className="sep"/>
        <button className="tb-btn secondary" onClick={importJSON}>📂 Import</button>
        <button className="tb-btn secondary" onClick={exportJSON}>💾 Save JSON</button>
        <button className="tb-btn secondary" onClick={createCopy}>📋 Create Copy</button>
        <div className="tr">
          <button className="tb-btn primary" onClick={()=>window.print()}>🖨 Export PDF</button>
        </div>
      </div>
      <div className="app-body">
        <div className="left-panel">
          <div className="panel-tabs">
            <button className={`panel-tab${tab==="sections"?" active":""}`} onClick={()=>setTab("sections")}>Sections</button>
            <button className={`panel-tab${tab==="customize"?" active":""}`} onClick={()=>setTab("customize")}>Customize</button>
            <button className={`panel-tab${tab==="json"?" active":""}`} onClick={()=>setTab("json")}>JSON</button>
          </div>
          <div className="panel-content">
            {tab==="sections"&&<SectionsTab resume={resume} update={update} onAddSection={()=>setAddModal(true)}/>}
            {tab==="customize"&&<CustomizeTab custom={custom} setCustom={setCustom}/>}
            {tab==="json"&&<JsonTab jsonText={jsonText} setJsonText={setJsonText} onApply={applyJSON}/>}
          </div>
        </div>
        <div className="preview-area">
          <div className="preview-scale-note">Live preview — Ctrl+Z to undo · Ctrl+Y to redo</div>
          <div className="resume-paper">
            <ResumePreview resume={resume} custom={custom}/>
          </div>
        </div>
      </div>
      {addModal&&<AddSectionModal onAdd={addSection} onClose={()=>setAddModal(false)}/>}
    </div>
  );
}

/* ======================== SECTIONS TAB ======================== */
function SectionsTab({resume,update,onAddSection}){

  return(
    <div>
      {/* Personal */}
      <div className="section-row" style={{marginBottom:7,borderColor:expandedPersonal?"#e84393":"#eee"}}>

          <span style={{flex:1,fontSize:13,fontWeight:700,color:"#1a1a2e"}}>Personal Info</span>

              value={sec.title}
              onChange={e=>update(n=>{const s=n.sections.find(x=>x.id===sec.id);if(s)s.title=e.target.value;})}
              onClick={e=>e.stopPropagation()}
            />

function SectionEditor({sec,update}){
  const upd=(fn)=>update(n=>{const s=n.sections.find(x=>x.id===sec.id);if(s)fn(s);});
  if(sec.type==="text")return <EditText sec={sec} upd={upd}/>;
  if(sec.type==="skills")return <EditSkills sec={sec} upd={upd}/>;
  if(sec.type==="experience")return <EditExperience sec={sec} upd={upd}/>;
  if(sec.type==="projects")return <EditProjects sec={sec} upd={upd}/>;
  if(sec.type==="education")return <EditEducation sec={sec} upd={upd}/>;
  if(sec.type==="publications")return <EditPublications sec={sec} upd={upd}/>;
  if(sec.type==="list")return <EditList sec={sec} upd={upd}/>;
  return <div style={{fontSize:12,color:"#888"}}>Unsupported type: {sec.type}</div>;
}

        <div className="cust-row">
          <label>Line Height</label>
          <input type="range" min={1.1} max={2} step={0.05} value={custom.lineHeight} onChange={e=>set("lineHeight",+e.target.value)}/>
          <span>{custom.lineHeight.toFixed(2)}</span>
        </div>
      </div>
      <div className="cust-section">
        <div className="cust-title">Page Layout</div>
        <div className="cust-row">
          <label>Horizontal Margin</label>
          <input type="range" min={8} max={45} step={1} value={custom.marginX} onChange={e=>set("marginX",+e.target.value)}/>
          <span>{custom.marginX}mm</span>
        </div>
        <div className="cust-row">
          <label>Vertical Margin</label>
          <input type="range" min={8} max={40} step={1} value={custom.marginY} onChange={e=>set("marginY",+e.target.value)}/>
          <span>{custom.marginY}mm</span>
        </div>
      </div>
      <div className="cust-section">
        <div className="cust-title">Colors</div>
        <div className="cust-row"><label>Name Color</label><input type="color" className="color-dot" value={custom.nameColor} onChange={e=>set("nameColor",e.target.value)}/></div>
        <div className="cust-row"><label>Accent / Heading</label><input type="color" className="color-dot" value={custom.accentColor} onChange={e=>set("accentColor",e.target.value)}/></div>
        <div className="cust-row"><label>Section Line</label><input type="color" className="color-dot" value={custom.sectionLineColor} onChange={e=>set("sectionLineColor",e.target.value)}/></div>
        <div className="cust-row"><label>Link Color</label><input type="color" className="color-dot" value={custom.linkColor} onChange={e=>set("linkColor",e.target.value)}/></div>
        <div className="cust-row"><label>Date Color</label><input type="color" className="color-dot" value={custom.dateColor} onChange={e=>set("dateColor",e.target.value)}/></div>
        <div className="cust-row"><label>Body Text Color</label><input type="color" className="color-dot" value={custom.bulletColor} onChange={e=>set("bulletColor",e.target.value)}/></div>
      </div>
      <div className="cust-section">
        <div className="cust-title">Section Heading Style</div>
        <div className="cust-row">
          <label>Heading Weight</label>
          <select className="cust-select" value={custom.headingWeight} onChange={e=>set("headingWeight",e.target.value)}>
            <option value="400">Regular</option>
            <option value="500">Medium</option>
            <option value="600">Semibold</option>
            <option value="700">Bold</option>
            <option value="800">Extrabold</option>
          </select>
        </div>
      </div>
      <button className="add-btn" style={{marginTop:8}} onClick={()=>setCustom(DFLT_CUSTOM)}>↺ Reset to Defaults</button>
    </div>
  );
}

/* ======================== JSON TAB ======================== */
function JsonTab({jsonText,setJsonText,onApply}){
  return(
    <div>
      <p style={{fontSize:12,color:"#888",marginBottom:8}}>Edit the JSON below and click Apply to update your resume, or use Export to save.</p>
      <textarea className="json-ta" value={jsonText} onChange={e=>setJsonText(e.target.value)}/>
      <button className="btn pink" style={{width:"100%",marginTop:8,padding:9}} onClick={onApply}>Apply JSON Changes</button>
    </div>
  );
}

/* ======================== ADD SECTION MODAL ======================== */
function AddSectionModal({onAdd,onClose}){
  const[title,setTitle]=useState("New Section");
  const[type,setType]=useState("text");
  const types=[
    {v:"text",l:"Text / Paragraph"},
    {v:"skills",l:"Skills"},
    {v:"experience",l:"Work Experience"},
    {v:"projects",l:"Projects"},
    {v:"education",l:"Education"},
    {v:"publications",l:"Publications"},
    {v:"list",l:"List (Certifications etc.)"},
    {v:"custom",l:"Custom (Free-form)"},
  ];
  return(
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal">
        <div className="modal-title">Add New Section</div>
        <div className="fg"><label className="fl">Section Title</label><input className="fi" value={title} onChange={e=>setTitle(e.target.value)} autoFocus/></div>
        <div className="fg"><label className="fl">Section Type</label>
          <select className="fi" value={type} onChange={e=>setType(e.target.value)}>
            {types.map(t=><option key={t.v} value={t.v}>{t.l}</option>)}
          </select>
        </div>
        <div className="modal-actions">
          <button className="btn ghost" onClick={onClose}>Cancel</button>
          <button className="btn pink" onClick={()=>onAdd(type,title)}>Add Section</button>
        </div>
      </div>
    </div>
  );
}

/* ======================== RESUME PREVIEW ======================== */
function ResumePreview({resume,custom}){
  const px=n=>n*1.3333;
  const C=custom;
  const mm=n=>`${n*3.7795}px`;

  const style={
    fontFamily:`'${C.fontFamily}',serif`,
    fontSize:px(C.fontSize)+"px",
    lineHeight:C.lineHeight,
    padding:`${mm(C.marginY)} ${mm(C.marginX)}`,
    color:C.bulletColor,
  };

  const p=resume.personal;

  return(
    <div style={style}>
      {/* Header */}
      <div style={{marginBottom:"14px"}}>
        <div style={{fontSize:px(C.nameSize)+"px",fontWeight:800,color:C.nameColor,letterSpacing:"-0.5px",lineHeight:1.1}}>{p.name}</div>
        {p.title&&<div style={{fontSize:px(C.titleSize)+"px",color:C.dateColor,marginTop:"3px",fontWeight:500}}>{p.title}</div>}
        <div style={{display:"flex",flexWrap:"wrap",gap:"3px 12px",marginTop:"5px",fontSize:px(C.fontSize-0.5)+"px",color:C.dateColor}}>
          {p.email&&<span>✉ {p.email}</span>}
          {p.phone&&<span>📞 {p.phone}</span>}
          {p.location&&<span>📍 {p.location}</span>}
          {p.links.filter(l=>l.visible&&l.text).map(l=>(
            <span key={l.id}>
              {l.url?<a href={l.url} style={{color:C.linkColor,textDecoration:"none"}}>{l.text}</a>:l.text}
            </span>
          ))}
        </div>
      </div>

      {/* Sections */}
      {resume.sections.filter(s=>s.visible).map(s=>(
        <div key={s.id} style={{marginBottom:"10px"}}>
          <div style={{
            display:"flex",alignItems:"center",gap:"8px",marginBottom:"5px"
          }}>
            <div style={{
              fontSize:px(C.headingSize)+"px",fontWeight:C.headingWeight,
              color:C.accentColor,textTransform:"uppercase",letterSpacing:"1px",
              whiteSpace:"nowrap"
            }}>{s.title}</div>
            <div style={{flex:1,height:"1.5px",background:C.sectionLineColor,opacity:.9}}/>
          </div>
          <SectionPreview sec={s} custom={C} px={px}/>
        </div>
      ))}
    </div>
  );
}

function SectionPreview({sec,custom:C,px}){
  if(sec.type==="text")return(
    <div style={{fontSize:px(C.fontSize)+"px",lineHeight:C.lineHeight,color:C.bulletColor}}>{sec.content}</div>
  );
  if(sec.type==="skills")return(
    <div style={{fontSize:px(C.fontSize)+"px"}}>
      {sec.items.filter(i=>i.visible).map(i=>(
        <div key={i.id} style={{display:"flex",marginBottom:"1.5px"}}>
          <span style={{fontWeight:700,color:C.accentColor,minWidth:"160px",flexShrink:0}}>{i.label}</span>
          <span style={{color:C.bulletColor}}> — {i.value}</span>
        </div>
      ))}
    </div>
  );
  if(sec.type==="experience")return(
    <div>
      {sec.items.filter(i=>i.visible).map(i=>(
        <div key={i.id} style={{marginBottom:"8px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
            <div>
              <span style={{fontWeight:700,fontSize:px(C.fontSize+0.5)+"px",color:C.accentColor}}>{i.title}</span>
              {i.company&&<span style={{color:C.bulletColor}}>, {
                i.companyUrl?<a href={i.companyUrl} style={{color:C.linkColor,textDecoration:"none"}}>{i.company}</a>:i.company
              }</span>}
            </div>
            <span style={{fontSize:px(C.fontSize-0.5)+"px",color:C.dateColor,whiteSpace:"nowrap",marginLeft:"8px"}}>
              {i.startDate}{i.endDate?` – ${i.endDate}`:""}{i.location?` | ${i.location}`:""}
            </span>
          </div>
          <ul style={{marginLeft:"14px",marginTop:"2px"}}>
            {i.bullets.filter(b=>b.visible).map(b=>(
              <li key={b.id} style={{fontSize:px(C.fontSize)+"px",lineHeight:C.lineHeight,color:C.bulletColor}}>{b.text}</li>
            ))}
          </ul>
        </div>
      ))}
    </div>
  );
  if(sec.type==="projects")return(
    <div>
      {sec.items.filter(i=>i.visible).map(i=>(
        <div key={i.id} style={{marginBottom:"7px"}}>
          <div style={{fontWeight:700,fontSize:px(C.fontSize+0.5)+"px",color:C.accentColor}}>
            {i.url?<a href={i.url} style={{color:C.accentColor,textDecoration:"none"}}>{i.title}</a>:i.title}
            {i.subtitle&&<span style={{fontWeight:400,color:C.dateColor,fontSize:px(C.fontSize)+"px"}}>, {i.subtitle}</span>}
          </div>
          <ul style={{marginLeft:"14px",marginTop:"2px"}}>
            {i.bullets.filter(b=>b.visible).map(b=>(
              <li key={b.id} style={{fontSize:px(C.fontSize)+"px",lineHeight:C.lineHeight,color:C.bulletColor}}>{b.text}</li>
            ))}
          </ul>
        </div>
      ))}
    </div>
  );
  if(sec.type==="education")return(
    <div>
      {sec.items.filter(i=>i.visible).map(i=>(
        <div key={i.id} style={{marginBottom:"5px",display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
          <div>
            <span style={{fontWeight:700,color:C.accentColor,fontSize:px(C.fontSize+0.5)+"px"}}>{i.degree}</span>
            {i.school&&<span style={{color:C.bulletColor}}>, {
              i.schoolUrl?<a href={i.schoolUrl} style={{color:C.linkColor,textDecoration:"none"}}>{i.school}</a>:i.school
            }</span>}
            {i.description&&<div style={{fontSize:px(C.fontSize)+"px",marginTop:"1px",color:C.bulletColor}}>{i.description}</div>}
          </div>
          <span style={{fontSize:px(C.fontSize-0.5)+"px",color:C.dateColor,whiteSpace:"nowrap",marginLeft:"8px"}}>
            {i.startDate}{i.endDate?` – ${i.endDate}`:""}{i.location?` | ${i.location}`:""}
          </span>
        </div>
      ))}
    </div>
  );
  if(sec.type==="publications")return(
    <div>
      {sec.items.filter(i=>i.visible).map(i=>(
        <div key={i.id} style={{marginBottom:"4px",fontSize:px(C.fontSize)+"px"}}>
          <span style={{fontWeight:600,color:C.accentColor}}>
            {i.url?<a href={i.url} style={{color:C.accentColor,textDecoration:"none"}}>{i.title}</a>:i.title}
          </span>
          {i.publisher&&<span style={{color:C.dateColor}}> — {i.publisher}</span>}
          {i.date&&<span style={{color:C.dateColor}}>, {i.date}</span>}
        </div>
      ))}
    </div>
  );
  if(sec.type==="list")return(
    <div style={{columns:2,columnGap:"20px",fontSize:px(C.fontSize)+"px"}}>
      {sec.items.filter(i=>i.visible).map(i=>(
        <div key={i.id} style={{breakInside:"avoid",marginBottom:"2px"}}>
          • {i.url?<a href={i.url} style={{color:C.linkColor,textDecoration:"none"}}>{i.text}</a>:i.text}
          {i.source&&<span style={{color:C.dateColor}}> ({i.source})</span>}
        </div>
      ))}
    </div>
  );
  return <div style={{color:"#888",fontSize:"12px"}}>[{sec.type} section]</div>;
}

/* ======================== RENDER ======================== */
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
